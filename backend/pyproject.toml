[project]
name = "rag-ops"
version = "0.1.0"
description = "RAGOps for application metrics"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.136.3",
    "uvicorn[standard]>=0.49.0",
    "matplotlib>=3.10.9",
    "mlxtend>=0.25.0",
    "numpy>=2.4.6",
    "pandas>=3.0.3",
    "scikit-learn>=1.9.0",
    "torch>=2.2.0",
    "sqlalchemy>=2.0.51",
    "alembic>=1.18.5",
    "asyncpg>=0.31.0",
    "psycopg2-binary>=2.9.9",
    "python-dotenv>=1.0.1",
    "sentence-transformers>=4.1.0",
    "spacy>=3.8.7",
    "google-genai>=1.26.0",
]

[build-system]
requires = ["hatchling>=1.26.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_ops"]

[tool.ruff]
# Target version matching your system framework
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "A", "RUF"]
ignore = []

[tool.ruff.lint.isort]
combine-as-imports = true
known-first-party = ["rag_ops"]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
